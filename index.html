<<!DOCTYPE html>
    <html lang="ar">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Secret Love</title>
    </head>

    <body>

        <div class="bg"></div>
        <div class="overlay"></div>

        <div class="container">

            <!-- الصفحة الأولى -->
            <div id="welcomePage">

                <h1>
                    ازيك يا حبيب عيوني
                    <span class="hearts">❤️ ❤️ ❤️</span>
                </h1>

                <p class="subtitle">دخل الباسورد صح يا روحي يلا 💕</p>

                <input type="password" id="passwordInput" placeholder="الباسورد">
                <br>

                <button onclick="checkPassword()">اتفضل ي استاذ</button>

                <p id="errorMessage" class="error hidden"></p>
            </div>

            <!-- الصفحة الثانية -->
            <div id="secondPage" class="hidden">

                <h2>جاهز يا حبيبي؟ 💕</h2>

                <button onclick="answerReady(true)">جاهز</button>
                <button onclick="answerReady(false)">لا</button>

                <p id="readyMessage"></p>

                <div id="quizSection" class="hidden">
                    <div id="qBox">



                        <h2 id="questionText">بتحبني؟ 👈👉</h2>

                        <div id="options">
                            <button onclick="chooseAnswer('اه')">اه 💕</button>
                            <button onclick="chooseAnswer('لا')">لا 😏</button>
                        </div>

                        <p id="msg"></p>

                        <button id="nextBtn" class="hidden" onclick="nextQuestion()">التالي</button>

                    </div>

                    <p id="msg"></p>

                    <button id="nextBtn" class="hidden" onclick="nextQuestion()">التالي</button>

                </div>
            </div>

        </div>

        </div>
        <script src="index.js"></script>

    </body>

    </html>
